# The registry on Cloudflare's Workers (README.md, "On Cloudflare").
# `npx wrangler d1 create sayon-registry` and
# `npx wrangler kv namespace create ARCHIVES` print the ids to put below.
name = "sayon-registry"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "sayon-registry"
database_id = "the id `wrangler d1 create` printed"

[[kv_namespaces]]
binding = "ARCHIVES"
id = "the id `wrangler kv namespace create` printed"
